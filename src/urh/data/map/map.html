<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RF Exploration Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e2226; }
  #map { height: 100vh; width: 100vw; }
  .legend {
    background: rgba(20, 24, 28, 0.88);
    color: #cfd6dc;
    font: 12px/1.5 system-ui, sans-serif;
    padding: 8px 10px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .legend b { color: #fff; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); }
  .status {
    background: rgba(20, 24, 28, 0.88);
    color: #cfd6dc;
    font: 12px/1.5 system-ui, sans-serif;
    padding: 8px 10px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .status b { color: #fff; }
  .est-popup { font: 12px/1.5 system-ui, sans-serif; }
  .leaflet-div-icon.est-marker {
    background: transparent;
    border: none;
  }
  .est-marker .pin {
    width: 36px; height: 36px;
    border: 5px solid #ff3030;
    border-radius: 50%;
    background: rgba(255, 30, 30, 0.30);
    box-shadow: 0 0 12px rgba(255, 40, 40, 0.9);
    position: relative;
  }
  .est-marker .pin::before, .est-marker .pin::after {
    content: ""; position: absolute; background: #ff3030;
  }
  .est-marker .pin::before { left: 50%; top: -10px; width: 4px; height: 56px; transform: translateX(-50%); }
  .est-marker .pin::after { top: 50%; left: -10px; height: 4px; width: 56px; transform: translateY(-50%); }
</style>
</head>
<body>
<div id="map"></div>

<script>
(function () {
  "use strict";

  var map = L.map("map", { zoomControl: true }).setView([40.0, -3.0], 12);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var samplesLayer = L.layerGroup().addTo(map);
  var estimateLayer = L.layerGroup().addTo(map);
  var gpsLayer = L.layerGroup().addTo(map);

  // GPS always stays centered; only skip estimate fly-to once the user interacts.
  var userMoved = false;
  map.on("dragstart zoomstart", function () { userMoved = true; });
  map.on("click", function () { userMoved = true; });

  function rssiColor(rssi) {
    // RSSI is mean ADC power on a dB scale: noise ~ +14, full scale ~ +42,
    // far narrowband signals well below 0. Span -80..40 covers it all.
    var t = (Math.max(-80, Math.min(40, rssi)) + 80) / 120; // 0..1, -80..40
    var r = Math.round(60 + 195 * t);
    var g = Math.round(180 - 180 * t);
    var b = Math.round(60 + 60 * t);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function rssiRadius(rssi) {
    var c = Math.max(-80, Math.min(40, rssi)) + 80;
    return Math.max(6, Math.min(22, 6 + c * 0.2));
  }

  // Keep one marker per sample id, so re-sampling updates in place.
  var sampleMarkers = {};
  var lastEstLat = null, lastEstLon = null;

  // GPS breadcrumb trail.
  var gpsTrailLayer = L.layerGroup().addTo(map);
  var gpsTrailPoints = [];
  var gpsPoly = null;
  var lastGps = null;

  function upsertSamples(samples) {
    var addedNew = false;
    samples.forEach(function (s) {
      var id = s[0], lat = s[1], lon = s[2], rssi = s[3];
      if (sampleMarkers[id]) {
        sampleMarkers[id].setLatLng([lat, lon]);
        sampleMarkers[id].setStyle({ radius: rssiRadius(rssi), color: rssiColor(rssi), fillColor: rssiColor(rssi) });
      } else {
        var m = L.circleMarker([lat, lon], {
          radius: rssiRadius(rssi),
          color: rssiColor(rssi),
          weight: 1,
          fillColor: rssiColor(rssi),
          fillOpacity: 0.75
        });
        m.bindPopup("<b>RSSI " + rssi.toFixed(1) + " dB</b><br>" + lat.toFixed(6) + ", " + lon.toFixed(6));
        m.addTo(samplesLayer);
        sampleMarkers[id] = m;
        addedNew = true;
      }
    });
    // Show the whole survey area (including far-away samples) until the user
    // takes over the map with their own drag/zoom.
    if (addedNew && !userMoved && Object.keys(sampleMarkers).length > 0) {
      var bounds = Object.keys(sampleMarkers).map(function (id) { return sampleMarkers[id].getLatLng(); });
      map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40], maxZoom: 18 });
    }
    var count = Object.keys(sampleMarkers).length;
    document.getElementById("sample-count").textContent = count;
  }

  function setEstimate(est) {
    estimateLayer.clearLayers();
    if (!est || typeof est.lat !== "number" || typeof est.lon !== "number") return;
    var icon = L.divIcon({ className: "est-marker", html: '<div class="pin"></div>', iconSize: [36, 36], iconAnchor: [18, 18] });
    var m = L.marker([est.lat, est.lon], { icon: icon });
    var conf = est.confidence || "low";
    var confColor = { high: "#2e9e4f", medium: "#d98f1a", low: "#c94343" }[conf] || "#c94343";
    if (est.radius_m > 0) {
      L.circle([est.lat, est.lon], {
        radius: est.radius_m,
        color: confColor,
        weight: 1,
        dashArray: "4,4",
        fillColor: confColor,
        fillOpacity: 0.10
      }).addTo(estimateLayer);
    }
    // Direction arrow from the receiver's last known position to the emitter.
    if (lastGps && (Math.abs(lastGps[0] - est.lat) > 1e-7 || Math.abs(lastGps[1] - est.lon) > 1e-7)) {
      var arrowLine = L.polyline([[lastGps[0], lastGps[1]], [est.lat, est.lon]], {
        color: "#ff3030", weight: 2, dashArray: "6,5", opacity: 0.85
      }).addTo(estimateLayer);
      // Small arrowhead pointing toward the emitter.
      var brg = map.project([lastGps[0], lastGps[1]]).angleTo(map.project([est.lat, est.lon]));
      var tip = map.project([est.lat, est.lon]);
      var back = tip.add(L.point(-Math.cos(brg) * 14, -Math.sin(brg) * 14));
      var left = back.add(L.point(Math.cos(brg + 2.5) * 9, Math.sin(brg + 2.5) * 9));
      var right = back.add(L.point(Math.cos(brg - 2.5) * 9, Math.sin(brg - 2.5) * 9));
      L.polygon([tip, left, right], { color: "#ff3030", weight: 1, fillColor: "#ff3030", fillOpacity: 0.9 })
        .addTo(estimateLayer);
    }
    m.bindPopup(
      '<div class="est-popup"><b>Emitter estimate</b><br>' +
      "Lat: " + est.lat.toFixed(6) + "<br>Lon: " + est.lon.toFixed(6) + "<br>" +
      "Method: " + (est.method || "?") + "<br>" +
      "Confidence: <span style='color:" + confColor + ";font-weight:bold'>" + conf + "</span>" +
      (est.rms ? "<br>RMS: " + est.rms.toFixed(2) + " dB" : "") +
      (est.p0 ? "<br>P0: " + est.p0.toFixed(1) + " dBm" : "") +
      (est.n ? "<br>path-loss n: " + est.n.toFixed(2) : "") +
      "</div>", { closeButton: false });
    m.addTo(estimateLayer);
    if (!userMoved && (typeof lastEstLat !== "number" || Math.abs(lastEstLat - est.lat) > 1e-5 || Math.abs(lastEstLon - est.lon) > 1e-5)) {
      map.flyTo([est.lat, est.lon], Math.max(map.getZoom(), 17));
      m.openPopup();
    }
    lastEstLat = est.lat;
    lastEstLon = est.lon;
  }

  function setGps(lat, lon, hdop) {
    // Only position the view from GPS before any samples exist; once samples
    // are on the map the view is driven by the samples/estimate so far-away
    // ones stay visible.
    if (Object.keys(sampleMarkers).length === 0) {
      map.setView([lat, lon], Math.max(map.getZoom(), 16));
    }

    // Breadcrumb trail: drop a faded mark where we were before moving.
    if (lastGps && (Math.abs(lastGps[0] - lat) > 4e-5 || Math.abs(lastGps[1] - lon) > 4e-5)) {
      gpsTrailPoints.push(lastGps);
      L.circleMarker(lastGps, {
        radius: 3,
        color: "#777",
        weight: 1,
        fillColor: "#999",
        fillOpacity: 0.6
      }).addTo(gpsTrailLayer)
        .bindPopup("<b>Previous GPS</b><br>" + lastGps[0].toFixed(6) + ", " + lastGps[1].toFixed(6));
      if (gpsPoly) gpsPoly.remove();
      gpsPoly = L.polyline(gpsTrailPoints.concat([[lat, lon]]), {
        color: "#2f7ff0",
        weight: 2,
        dashArray: "4,4"
      }).addTo(gpsTrailLayer);
    }
    lastGps = [lat, lon];

    gpsLayer.clearLayers();
    var m = L.circleMarker([lat, lon], {
      radius: 7,
      color: "#ffffff",
      weight: 2,
      fillColor: "#2f7ff0",
      fillOpacity: 0.9
    });
    m.bindPopup("<b>GPS position</b><br>" + lat.toFixed(6) + ", " + lon.toFixed(6) +
      (hdop ? "<br>HDOP: " + hdop.toFixed(1) : ""), { closeButton: false });
    m.addTo(gpsLayer);
    document.getElementById("gps-status").textContent = "GPS " + lat.toFixed(5) + ", " + lon.toFixed(5);
  }

  function setGpsStatus(text) {
    document.getElementById("gps-status").textContent = text;
  }

  function fitAll() {
    var all = [];
    Object.keys(sampleMarkers).forEach(function (id) { all.push(sampleMarkers[id].getLatLng()); });
    if (all.length) {
      map.fitBounds(L.latLngBounds(all), { padding: [40, 40] });
    }
  }

  function clearAll() {
    samplesLayer.clearLayers();
    estimateLayer.clearLayers();
    gpsLayer.clearLayers();
    gpsTrailLayer.clearLayers();
    gpsTrailPoints = [];
    gpsPoly = null;
    lastGps = null;
    sampleMarkers = {};
    document.getElementById("sample-count").textContent = 0;
  }

  var api = { upsertSamples: upsertSamples, setEstimate: setEstimate, setGps: setGps, setGpsStatus: setGpsStatus, fitAll: fitAll, clearAll: clearAll };

  // HTML
  var legend = L.control({ position: "topright" });
  legend.onAdd = function () {
    var div = L.DomUtil.create("div", "legend");
    div.innerHTML =
      '<b>Signal</b>' +
      '<div class="row"><span class="swatch" style="background:rgb(255,110,60)"></span>strong (-40 dB)</div>' +
      '<div class="row"><span class="swatch" style="background:rgb(255,200,60)"></span>medium (-80 dB)</div>' +
      '<div class="row"><span class="swatch" style="background:rgb(60,180,120)"></span>weak (-120 dB)</div>';
    return div;
  };
  legend.addTo(map);

  var status = L.control({ position: "bottomleft" });
  status.onAdd = function () {
    var div = L.DomUtil.create("div", "status");
    div.innerHTML = '<b>Samples:</b> <span id="sample-count">0</span> &nbsp;|&nbsp; <span id="gps-status">GPS: waiting</span>';
    return div;
  };
  status.addTo(map);

  // Fit control
  var fitCtrl = L.control({ position: "bottomright" });
  fitCtrl.onAdd = function () {
    var b = L.DomUtil.create("a", "leaflet-bar leaflet-control");
    b.href = "#";
    b.style.cssText = "width:30px;height:30px;line-height:30px;text-align:center;font-size:18px;font-weight:bold;background:#fff;color:#333";
    b.innerHTML = "&#9742;";
    L.DomEvent.on(b, "click", function (e) { L.DomEvent.stop(e); fitAll(); });
    return b;
  };
  fitCtrl.addTo(map);

  // Bridge to Qt (if webchannel is available)
  if (typeof qt !== "undefined" && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      window.rfmap = channel.objects.rfmap;
      window.rfmap.mapReady();
      window.onerror = function (msg, src, line, col) {
        if (window.rfmap) {
          window.rfmap.reportError(msg + " @" + (src || "?") + ":" + line);
        }
        return false;
      };
    });
  }

  map.on("click", function (e) {
    if (window.rfmap) {
      window.rfmap.mapClicked(e.latlng.lat, e.latlng.lng);
    }
  });

  window.WZRD = api;
})();
</script>
</body>
</html>
